name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put files in Android project layout
        run: |
          mkdir -p app/src/main/java/com/example/bafangdiagnostic
          cp MainActivity.kt app/src/main/java/com/example/bafangdiagnostic/
          cp AndroidManifest.xml app/src/main/
          cp build.gradle.kts app/build.gradle.kts
          cp "build.gradle (1).kts" build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: M420-USB-probe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
